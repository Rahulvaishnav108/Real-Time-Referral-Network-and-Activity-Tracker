services:
  mongo:
    image: mongo:7
    container_name: referral-network-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - referral_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  referral_mongo_data:
